<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16843f" />
    <meta name="description" content="Order fresh groceries and daily essentials online for doorstep delivery." />
    <title>QuickKirana — Groceries delivered to your door</title>
    <!--
      Apply the saved colour theme before the first paint, so dark-mode users never see a white flash.
      Mirrors src/shared/theme/theme.js (same storage key and rule). When a Content-Security-Policy is
      added (Phase 8), allow this script by its hash.
    -->
    <script>
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('qk_theme') || 'system'
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.dataset.theme = dark ? 'dark' : 'light'
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
